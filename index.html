<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InkSight Reference</title><style>body{margin:0;background:#000;color:#fff;font:18px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(600px,100vw);height:min(600px,100vw);box-sizing:border-box;padding:22px;display:flex;flex-direction:column;gap:14px}header{font-size:18px;font-weight:700;color:#8be9c7}#viewport{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;border:1px solid #666;border-radius:12px}img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center}footer{font-size:14px;color:#ddd;display:flex;justify-content:space-between}button,input{font:inherit}button{background:#222;color:white;border:1px solid #aaa;border-radius:8px;padding:8px}#controls{display:flex;gap:8px}#file{width:100%;font-size:12px}</style></head><body><main><header>INKSIGHT · REFERENCE</header><input id="file" type="file" accept="image/*" aria-label="Choose reference image"><div id="viewport"><img id="reference" alt="Selected tattoo reference" hidden><span id="empty">Choose a reference image</span></div><div id="controls"><button id="out">−</button><button id="in">+</button><button id="reset">Reset</button></div><footer><span id="status">Ready</span><span id="zoom">1.0×</span></footer></main><script>const $=id=>document.getElementById(id);let scale=1,offsetX=0,offsetY=0,url=null;function render(){ $('reference').style.transform=`translate(${offsetX}px,${offsetY}px) scale(${scale})`; $('zoom').textContent=scale.toFixed(1)+'×';}function change(delta){scale=Math.max(1,Math.min(5,scale+delta));render();}function reset(){scale=1;offsetX=offsetY=0;render();} $('file').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);$('reference').src=url;$('reference').hidden=false;$('empty').hidden=true;$('status').textContent=f.name;reset();};$('in').onclick=()=>change(.25);$('out').onclick=()=>change(-.25);$('reset').onclick=reset;document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowRight')change(.25);if(e.key==='ArrowDown'||e.key==='ArrowLeft')change(-.25);if(e.key==='Enter')reset();});let start=null;$('viewport').addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY};$('viewport').setPointerCapture(e.pointerId);});$('viewport').addEventListener('pointermove',e=>{if(!start)return;offsetX+=e.clientX-start.x;offsetY+=e.clientY-start.y;start={x:e.clientX,y:e.clientY};render();});$('viewport').addEventListener('pointerup',()=>start=null);</script></body></html>
